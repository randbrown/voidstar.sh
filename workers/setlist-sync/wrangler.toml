# Setlist sync Worker — proxies Spotify Web API and Google Drive API
# for the setlist lab's auto-linking feature.
#
# Secrets (set via `wrangler secret put`):
#   SPOTIFY_CLIENT_ID
#   SPOTIFY_CLIENT_SECRET
#   GOOGLE_API_KEY
#
# Optional — access control (STRONGLY recommended for a public worker):
#   WORKER_TOKEN           when set, every route (except / and /health) requires
#                          a matching X-Worker-Token header. Set the same value
#                          in the app: Settings → sync worker → access token.
#                          Without it anyone who learns the URL can spend your
#                          Spotify/AI/Drive quota. Unset = open (back-compat).
#
# Optional — better /web/* chart search (otherwise keyless DuckDuckGo HTML):
#   GOOGLE_CSE_ID          Programmable Search Engine id (pairs with GOOGLE_API_KEY;
#                          enable the Custom Search API on the same key)
#   BRAVE_SEARCH_API_KEY   Brave Search API token
#
# Optional — /ai/chart LLM chart drafting + /ai/chart-read scan reading
# (first configured provider wins):
#   ANTHROPIC_API_KEY      Claude, with web-search grounding
#
#   Model per route — each is a plain var, and each defaults to the cheapest
#   tier that does the job. A library-wide pass runs these once per song, so
#   the default matters far more than the ceiling does:
#   ANTHROPIC_MODEL          /ai/chart drafting; default claude-sonnet-5
#                            ($2/$10 per Mtok, vs $5/$25 on the Opus tier it
#                            used to default to)
#   ANTHROPIC_SUMMARY_MODEL  /ai/steel-summary; default claude-sonnet-5.
#                            Separate knob because a steel summary is ~80
#                            words — set it to claude-haiku-4-5 ($1/$5) to
#                            halve it again.
#   ANTHROPIC_READ_MODEL     /ai/chart-read; default claude-haiku-4-5.
#                            Reading a scan is transcription, so the cheapest
#                            tier is plenty. Do NOT "upgrade" this to a 4.7+
#                            model: those bill images at the high-resolution
#                            visual-token tier (up to 4784 tokens a page vs
#                            1568), i.e. ~3x the cost for the same read.
#
#   Any of the three accepts a Haiku-tier id and the request shape adapts to
#   it (claudeModelProfile) rather than 400-ing on every call.
#   GEMINI_API_KEY         Gemini, with Google Search grounding (free tier at
#                          aistudio.google.com/apikey)
#   GEMINI_MODEL           plain var; default gemini-2.5-flash
#
# The worker imports @anthropic-ai/sdk, so run `npm ci` at the repo root
# before deploying (wrangler bundles it from node_modules).
#
# Local dev:   npx wrangler dev -c workers/setlist-sync/wrangler.toml
# Deploy:      npx wrangler deploy -c workers/setlist-sync/wrangler.toml

name = "voidstar-setlist-sync"
main = "index.js"
compatibility_date = "2025-05-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://voidstar.sh"
